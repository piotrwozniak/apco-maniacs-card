name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:dist
      - run: python3 -m unittest discover -s tests
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          comment: "false"

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ['2026.3.0', '2026.11.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m unittest discover -s integration_tests
      - run: python scripts/package_integration.py
      - uses: actions/upload-artifact@v4
        if: matrix.homeassistant == '2026.11.1'
        with:
          name: apco-maniacs-integration-preview
          path: |
            output/apco-maniacs-integration.zip
            dist/apco-maniacs-card.js
