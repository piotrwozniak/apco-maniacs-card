<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf0f5">
<title>APCO Maniacs — Polski / English / Italiano / Español</title>
<style>
body{margin:0;background:#101921;font-family:system-ui,sans-serif;color:#e0e9ee}main{width:min(100% - 28px,1264px);margin:32px auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}warun-card{display:block}noscript{display:block;padding:30px}@media(max-width:850px){main{max-width:620px;grid-template-columns:1fr}}@media(max-width:480px){main{margin:14px auto}}@media(prefers-color-scheme:dark){body{background:#101b25}}
</style>

</head>
<body>
<main id="places"><noscript>Włącz JavaScript, aby pobrać prognozę i wyświetlić Warun.</noscript></main>
<script type="module">
  import './warun-card.js?v=25';
  for (const place of [
    {name: 'Faryny', latitude: 53.531944, longitude: 21.385556},
    {name: 'Piecki', latitude: 53.721, longitude: 21.015, language: 'en'},
    {name: 'Garda', latitude: 45.78, longitude: 10.82, timezone: 'Europe/Rome', language: 'it'},
    {name: 'Algodonales', latitude: 36.88, longitude: -5.40, timezone: 'Europe/Madrid', language: 'es'},
  ]) {
    const card = document.createElement('apco-maniacs-card');
    card.setConfig(place);
    document.querySelector('#places').append(card);
  }
</script>
</body>
</html>
